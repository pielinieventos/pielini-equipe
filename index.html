<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Pielini Equipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=EB+Garamond:wght@400;500;600;700&display=swap">
<style>
/* Layout: faixa verde Pielini no topo; lista de compras das próximas 2 semanas; depois um cartão por evento.
   Só leitura: a equipe vê datas, baristas e insumos. Valores e contatos de clientes ficam na Central. */
:root{
  --bg:#F5EFEF; --surface:#FFFFFF; --sunk:#EFE0DB; --line:#E0CFC9;
  --fg:#2A2A2A; --muted:#6A605D; --green:#546C62; --on-green:#F5EFEF; --blush:#EFE0DB;
  --accent:#B77A3D; --warn:#8A5A24; --warn-bg:#F6E7D6; --ok:#3F5A50; --ok-bg:#DCE7E2;
  --display:"Gloock","Playfair Display",Georgia,serif; --body:"EB Garamond",Garamond,Georgia,serif; --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1F1F; --surface:#2A2A2A; --sunk:#242424; --line:#3B3837; --fg:#F5EFEF; --muted:#BFB4B0;
  --green:#3F5149; --accent:#D39556; --warn:#E3B07A; --warn-bg:#3A2D1F; --ok:#9CC3B3; --ok-bg:#2C3A35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F1F1F; --surface:#2A2A2A; --sunk:#242424; --line:#3B3837; --fg:#F5EFEF; --muted:#BFB4B0;
  --green:#3F5149; --accent:#D39556; --warn:#E3B07A; --warn-bg:#3A2D1F; --ok:#9CC3B3; --ok-bg:#2C3A35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.5 var(--body)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
.top{background:var(--green);color:var(--on-green)}
.top .wrap{padding-block:22px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.top .logo{height:clamp(50px,8vw,64px);width:auto;color:var(--on-green);display:block}
.top span{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--blush);padding-bottom:6px}
main .wrap{padding-block:24px 56px;display:flex;flex-direction:column;gap:30px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:27px}
.sec p.sub{margin:0;color:var(--muted);font-size:16px}
.compras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.compras{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:15px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev .head{display:flex;gap:16px;align-items:stretch}
.ev .date{background:var(--green);color:var(--on-green);min-width:92px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ev .date b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.ev .date small{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--blush)}
.ev .info{padding:12px 16px 12px 0;min-width:0;flex:1}
.ev .info h3{font-size:22px}
.ev .meta{color:var(--muted);font-size:16px}
.ev .body{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.ev ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ev li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:3px}
.ev li b{font-variant-numeric:tabular-nums;text-align:right}
.ev h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:18px;color:var(--green)}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:14px;font-weight:600}
.tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.nota{margin:0;white-space:pre-line;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:16px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);background:var(--surface)}
.upd{color:var(--muted);font-size:15px;margin:0}
body{margin:0}
</style>
</head><body>

149 9.989 1.89 12.419 .029 12.419-1.801 12.419-3.061 9.93-3.061 6.149-3.061 2.43-1.83 0 0 0M.149 14.309C4.979 14.309 8.129 11.1 8.129 6.33 8.129 1.5 4.89-1.86 0-1.86-4.771-1.86-8.04 1.41-8.04 6.209-8.04 11.069-4.74 14.309 .149 14.309" fill="currentColor"/> </g> </svg> <span>Escala da equipe</span></div></header>
<main><div class="wrap">
  <section class="sec" id="login" aria-labelledby="h-login">
    <h2 id="h-login">Entrar</h2>
    <p class="sub">Digite a senha da equipe para ver a escala.</p>
    <form id="login-f" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="senha" type="password" autocomplete="current-password" required aria-label="Senha"
        style="flex:1 1 220px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)">
      <button type="submit" style="font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:8px;background:var(--green);color:var(--on-green);cursor:pointer">Entrar</button>
      <label style="display:flex;gap:6px;align-items:center;color:var(--muted);font-size:16px"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    </form>
    <p class="sub" id="login-erro" style="color:var(--warn)"></p>
  </section>
  <div id="conteudo" hidden>
  <section class="sec" aria-labelledby="h-comp">
    <h2 id="h-comp">Compras das próximas 2 semanas</h2>
    <p class="sub" id="comp-sub">Soma dos insumos dos eventos até 14 dias a partir de hoje.</p>
    <div class="compras">
      <div class="kpi"><b id="c-cafe">–</b><small>de café especial</small></div>
      <div class="kpi"><b id="c-leite">–</b><small>de leite</small></div>
      <div class="kpi"><b id="c-copos">–</b><small>copos</small></div>
    </div>
    <div id="c-pers"></div>
  </section>
  <section class="sec" aria-labelledby="h-ev">
    <h2 id="h-ev">Próximos eventos</h2>
    <div id="eventos"><div class="empty">Carregando a escala…</div></div>
    <p class="upd" id="upd"></p>
  </section>
</div></div></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dt = iso => new Date(iso + "T12:00:00");
const diff = (a, b) => Math.round((dt(a) - dt(b)) / 864e5);
const fmt = iso => iso ? iso.slice(8,10) + "/" + iso.slice(5,7) : "";
const num = v => Number(v || 0).toLocaleString("pt-BR");

function render(doc){
  const hoje = hojeISO();
  const evs = (doc?.eventos || []).filter(e => e.data >= hoje).sort((a, b) => a.data.localeCompare(b.data));
  const prox = evs.filter(e => diff(e.data, hoje) <= 14);
  $("#c-cafe").textContent = num(prox.reduce((a, e) => a + (e.kgCafe || 0), 0)) + " kg";
  $("#c-leite").textContent = num(prox.reduce((a, e) => a + (e.leite || 0), 0)) + " L";
  $("#c-copos").textContent = num(prox.reduce((a, e) => a + (e.copos || 0), 0));
  $("#comp-sub").textContent = prox.length ? `Soma de ${prox.length} ${prox.length === 1 ? "evento" : "eventos"} até ${fmt(new Date(Date.now() + 14 * 864e5).toISOString().slice(0,10))}.` : "Nenhum evento nos próximos 14 dias.";
  const pers = evs.filter(e => e.copo_texto);
  $("#c-pers").innerHTML = pers.length ? `<div class="kpi"><small>Copos personalizados</small><ul style="list-style:none;padding:0;margin:6px 0 0">${pers.map(e => `<li>${esc(e.copo_texto === "sim" ? e.cliente : e.copo_texto)} · evento ${fmt(e.data)} · <span class="tag ${diff(e.copos_ate, hoje) <= 3 ? "warn" : "ok"}">encomendar até ${fmt(e.copos_ate)}</span></li>`).join("")}</ul></div>` : "";
  $("#eventos").innerHTML = evs.length ? evs.map(e => {
    const d = dt(e.data), dias = diff(e.data, hoje);
    return `<article class="ev"><div class="head">
      <div class="date"><small>${d.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "")}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "")}</small></div>
      <div class="info"><h3>${esc(e.tipo)}${e.cliente ? " · " + esc(e.cliente) : ""}</h3>
        <div class="meta">${e.horario ? esc(e.horario) + " · " : ""}${esc([e.local, e.cidade].filter(Boolean).join(", ") || "Local a confirmar")}</div>
        <div class="meta">${dias === 0 ? "<b>Hoje</b>" : dias === 1 ? "<b>Amanhã</b>" : "Em " + dias + " dias"} · ${esc(e.estacao)} · ${e.convidados} convidados</div></div></div>
      <div class="body">
        <div><h4>Equipe</h4><p style="margin:0">${e.equipe ? esc(e.equipe) : `<span class="tag warn">Baristas a definir</span>`}</p><p class="meta" style="margin:4px 0 0">${e.baristas} ${e.baristas === 1 ? "barista" : "baristas"} no evento</p></div>
        <div><h4>Insumos</h4><ul><li><span>Café</span><b>${num(e.kgCafe)} kg</b></li>${e.leite ? `<li><span>Leite</span><b>${num(e.leite)} L</b></li>` : ""}<li><span>Copos</span><b>${num(e.copos)}</b></li>${e.copo_texto ? `<li><span>Personalizados</span><b>${esc(e.copo_texto === "sim" ? "sim" : e.copo_texto)}</b></li>` : ""}</ul></div>
        ${e.nota ? `<div><h4>Observações</h4><p class="nota">${esc(e.nota)}</p></div>` : ""}
      </div></article>`;
  }).join("") : `<div class="empty">Nenhum evento agendado por enquanto.</div>`;
  $("#upd").textContent = doc?.atualizado_em ? "Atualizado em " + new Date(doc.atualizado_em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) + "." : "";
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha){
  const r = await fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("sem-dados");
  const d = await r.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(d.salt), iterations: d.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const texto = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(d.iv) }, chave, b64(d.ct));
  return JSON.parse(new TextDecoder().decode(texto));
}
async function entrar(senha, lembrar){
  try {
    const dados = await abrir(senha);
    try { lembrar ? localStorage.setItem("pielini-equipe", senha) : localStorage.removeItem("pielini-equipe"); } catch {}
    $("#login").hidden = true; $("#conteudo").hidden = false; render(dados);
  } catch (e) {
    $("#login").hidden = false; $("#conteudo").hidden = true;
    $("#login-erro").textContent = e.message === "sem-dados" ? "A escala ainda não foi publicada. Tente mais tarde." : "Senha incorreta. Confira com a Pielini.";
  }
}
$("#login-f").addEventListener("submit", e => { e.preventDefault(); entrar($("#senha").value, $("#lembrar").checked); });
let salva = null; try { salva = localStorage.getItem("pielini-equipe"); } catch {}
if (salva) entrar(salva, true);

</script>

</body></html>
